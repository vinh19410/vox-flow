[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vox-flow-speaking-scraper"
version = "0.1.0"
description = "Local IELTS speaking sample scraper for TD-01 pipeline and cost prototyping"
requires-python = ">=3.11"
dependencies = [
  "scrapling[fetchers]>=0.4,<0.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
py-modules = ["scraper"]
