name: Deploy Beta (dev)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Beta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: beta
      url: https://vox.vinhtran.io.vn

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backup D1 database before migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p backups
          DB_NAME=$(pnpm dlx --silent wrangler@4.158.0 d1 list --json | jq -r '.[]? | select(.name|startswith("vox-flow-database-prod-")) | .name' | head -n 1)
          if [ -n "$DB_NAME" ]; then
            echo "Backing up D1 database: $DB_NAME"
            pnpm dlx --silent wrangler@4.158.0 d1 export "$DB_NAME" --remote --output="backups/d1-$DB_NAME-$(date +%Y%m%d%H%M%S).sql" 2>&1 | sed -E 's|https://[^ ]+|[REDACTED_PRESIGNED_URL]|g'
            ls -lh backups/*.sql
          else
            echo "No existing vox-flow D1 database found, skipping pre-deploy backup."
          fi

      - name: Upload D1 backup artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-backup-${{ github.sha }}
          path: backups/*.sql
          retention-days: 7
          if-no-files-found: ignore

      - name: Deploy to Cloudflare via Alchemy
        env:
          NODE_ENV: production
          ALCHEMY_STAGE: prod
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CORS_ORIGIN: https://vox.vinhtran.io.vn
          SEPAY_WEBHOOK_API_KEY: ${{ secrets.SEPAY_WEBHOOK_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID || 'eleven_multilingual_v2' }}
          ELEVENLABS_VOICE_UK_F: ${{ vars.ELEVENLABS_VOICE_UK_F || '' }}
          ELEVENLABS_VOICE_US_M: ${{ vars.ELEVENLABS_VOICE_US_M || '' }}
          ELEVENLABS_VOICE_AU_F: ${{ vars.ELEVENLABS_VOICE_AU_F || '' }}
          LAUNCH_OPEN: ${{ vars.LAUNCH_OPEN || 'false' }}
          LAUNCH_ALLOWED_EMAILS: ${{ vars.LAUNCH_ALLOWED_EMAILS || '' }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS || '' }}
          SCORE_DISPUTE_ENABLED: ${{ vars.SCORE_DISPUTE_ENABLED || 'false' }}
          SCORING_MODEL: ${{ vars.SCORING_MODEL || 'gpt-6-luna' }}
        run: pnpm --filter @vox-flow/infra run deploy --yes

      - name: Seed forecast topics into D1 (first time initialization only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DB_NAME=$(pnpm dlx --silent wrangler@4.158.0 d1 list --json | jq -r '.[]? | select(.name|startswith("vox-flow-database-prod-")) | .name' | head -n 1)
          if [ -n "$DB_NAME" ]; then
            EXISTING_COUNT=$(pnpm dlx --silent wrangler@4.158.0 d1 execute "$DB_NAME" --remote --command "SELECT COUNT(*) AS count FROM forecast_topic WHERE quarter = '2026-Q3'" --json | jq -r '.[0].results[0].count // 0')
            if [ "$EXISTING_COUNT" -eq 0 ]; then
              echo "Seeding D1 database: $DB_NAME (currently 0 topics)"
              pnpm dlx --silent wrangler@4.158.0 d1 execute "$DB_NAME" --remote --file=packages/db/scripts/seed-forecast-prod.sql
            else
              echo "D1 database already contains $EXISTING_COUNT topics for 2026-Q3, skipping seed."
            fi
          fi

      - name: Smoke test deployed endpoints
        run: |
          echo "Checking API health with retries..."
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors https://api.vox.vinhtran.io.vn/trpc/healthCheck
          echo ""
          echo "Checking Web SPA with retries..."
          curl -fsSI --retry 6 --retry-delay 10 --retry-all-errors https://vox.vinhtran.io.vn/ | head -n 1
          echo ""
          echo "Checking forecast published topics count..."
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors "https://api.vox.vinhtran.io.vn/trpc/forecast.listPublished?input=%7B%22quarter%22%3A%222026-Q3%22%7D" | jq '.result.data | length'
