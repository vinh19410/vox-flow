name: Seed Forecast Production (Manual)

on:
  workflow_dispatch:

concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  seed:
    name: Backup and Seed D1 Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: beta
      url: https://vox.vinhtran.io.vn

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backup D1 database before seeding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p backups
          DB_NAME=$(pnpm dlx --silent wrangler@4.158.0 d1 list --json | jq -r '.[]? | select(.name|startswith("vox-flow-database-prod-")) | .name' | head -n 1)
          if [ -n "$DB_NAME" ]; then
            echo "Backing up D1 database: $DB_NAME"
            pnpm dlx --silent wrangler@4.158.0 d1 export "$DB_NAME" --remote --output="backups/d1-$DB_NAME-$(date +%Y%m%d%H%M%S).sql" 2>&1 | sed -E 's|https://[^ ]+|[REDACTED_PRESIGNED_URL]|g'
            ls -lh backups/*.sql
          else
            echo "No existing vox-flow D1 database found!"
            exit 1
          fi

      - name: Upload pre-seed D1 backup artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-backup-pre-seed-${{ github.sha }}
          path: backups/*.sql
          retention-days: 7
          if-no-files-found: ignore

      - name: Execute D1 Seed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DB_NAME=$(pnpm dlx --silent wrangler@4.158.0 d1 list --json | jq -r '.[]? | select(.name|startswith("vox-flow-database-prod-")) | .name' | head -n 1)
          echo "Seeding D1 database: $DB_NAME with packages/db/scripts/seed-forecast-prod.sql"
          pnpm dlx --silent wrangler@4.158.0 d1 execute "$DB_NAME" --remote --file=packages/db/scripts/seed-forecast-prod.sql

      - name: Smoke check seeded topics via tRPC Public API
        run: |
          echo "Verifying published topics via public tRPC API..."
          COUNT=$(curl -fsS "https://api.vox.vinhtran.io.vn/trpc/forecast.listPublished?input=%7B%22quarter%22%3A%222026-Q3%22%7D" | jq '.result.data | length')
          echo "Published topics count: $COUNT"
          if [ "$COUNT" -lt 178 ]; then
            echo "Expected at least 178 topics, but got $COUNT"
            exit 1
          fi
          echo "Smoke check passed: $COUNT topics published!"
